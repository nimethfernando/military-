<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b33" />
      <stop offset="50%" stop-color="#061021" />
      <stop offset="100%" stop-color="#030812" />
    </linearGradient>

    <!-- Naval Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd566" />
      <stop offset="45%" stop-color="#f4b21b" />
      <stop offset="100%" stop-color="#b87f0b" />
    </linearGradient>

    <!-- Gunmetal Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Tab Icon Badge -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#shadow)" />
  
  <!-- Inner Delicate Golden Inset Line -->
  <rect x="10" y="10" width="108" height="108" rx="20" fill="none" stroke="#f4b21b" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 1.5" />

  <!-- Naval Anchor Crest at Top Center -->
  <g transform="translate(64, 25)" fill="url(#goldGrad)">
    <!-- Anchor Ring -->
    <circle cx="0" cy="-6" r="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Anchor Stock (Crossbar) -->
    <path d="M -10 -2 L 10 -2" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Anchor Shank -->
    <path d="M 0 -6 L 0 10" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Anchor Flukes & Crown -->
    <path d="M -11 4 C -9 11 9 11 11 4" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Palm Tips -->
    <polygon points="-11,4 -13,2 -9,2"/>
    <polygon points="11,4 13,2 9,2"/>
  </g>

  <!-- Twin Battle Honor Stars -->
  <g fill="url(#goldGrad)">
    <!-- Star Left -->
    <polygon points="26,20 28,24 32,24 29,26.5 30,30 26,27.5 22,30 23,26.5 20,24 24,24" />
    <!-- Star Right -->
    <polygon points="102,20 104,24 108,24 105,26.5 106,30 102,27.5 98,30 99,26.5 96,24 100,24" />
  </g>

  <!-- USS LCS-102 Gunboat Silhouette (Authentic Profile) -->
  <g transform="translate(18, 42)" filter="url(#shadow)">
    <!-- Main Hull (158-foot amphibious gunboat profile, low freeboard, forward sheer) -->
    <path d="M 2 15 L 14 15 L 20 12 L 76 12 L 86 6 L 90 6 L 86 18 L 6 18 Z" fill="url(#steelGrad)" />
    
    <!-- Red Antifouling Boot-topping / Keel waterline strip -->
    <path d="M 6 18 L 86 18 L 84 20 L 10 20 Z" fill="#b91c1c" />

    <!-- Forward 3"/50 Caliber Bow Gun Mount -->
    <path d="M 72 8 L 78 8 L 78 12 L 72 12 Z" fill="url(#steelGrad)" />
    <line x1="77" y1="9" x2="88" y2="7" stroke="url(#steelGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Forward Twin 40mm Bofors Gun Tub -->
    <path d="M 58 7 L 66 7 L 66 12 L 58 12 Z" fill="url(#steelGrad)" />
    <line x1="64" y1="8" x2="74" y2="5" stroke="url(#steelGrad)" stroke-width="1.4" stroke-linecap="round" />

    <!-- Pilot House / Armored Conning Tower (01 & 02 Level Bridge) -->
    <path d="M 40 4 L 54 4 L 54 12 L 40 12 Z" fill="url(#steelGrad)" />
    
    <!-- Mast with Yardarm & Radar Platform -->
    <line x1="46" y1="-5" x2="46" y2="4" stroke="url(#goldGrad)" stroke-width="1.8" />
    <line x1="41" y1="-1" x2="51" y2="-1" stroke="url(#goldGrad)" stroke-width="1.4" />
    <line x1="46" y1="-5" x2="49" y2="-7" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Aft 40mm Bofors Mount & Lookout Shelter (Added in 1953) -->
    <path d="M 24 8 L 36 8 L 36 12 L 24 12 Z" fill="url(#steelGrad)" />
    <line x1="26" y1="9" x2="16" y2="6" stroke="url(#steelGrad)" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Big Bold Military Hull Stencil: "102" -->
  <g transform="translate(64, 98)" text-anchor="middle" filter="url(#shadow)">
    <!-- Background Glow / Stroke for max contrast on any browser tab theme -->
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round">102</text>
    <!-- Sharp Gold Face -->
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="url(#goldGrad)">102</text>
  </g>

  <!-- Bottom Arch Subtitle: "USS LCS" -->
  <g transform="translate(64, 114)" text-anchor="middle">
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="9" font-weight="800" letter-spacing="2.5" fill="#e2e8f0" opacity="0.95">USS LCS</text>
  </g>
</svg>

